<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GPT-2 中文古诗生成 Demo</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #2563eb;
      --border: #e5e7eb;
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif;
    }
    .wrap {
      max-width: 760px;
      margin: 40px auto;
      padding: 0 16px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 26px;
    }
    .desc {
      color: var(--muted);
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
    }
    input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      font-size: 16px;
      margin-bottom: 12px;
    }
    button {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      cursor: pointer;
      font-size: 15px;
    }
    button:hover { opacity: 0.92; }
    .warn {
      margin-top: 12px;
      color: #b91c1c;
      background: #fef2f2;
      border: 1px solid #fecaca;
      padding: 10px;
      border-radius: 8px;
      white-space: pre-wrap;
    }
    .output {
      margin-top: 20px;
      padding: 14px;
      border-radius: 8px;
      background: #f9fafb;
      border: 1px dashed var(--border);
      line-height: 1.8;
      white-space: pre-wrap;
      font-size: 17px;
    }
    .foot {
      margin-top: 14px;
      color: var(--muted);
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>GPT-2 中文古诗生成</h1>
      <p class="desc">输入一个关键词或起始句，点击“生成诗句”即可得到模型输出，适合课堂展示与项目答辩演示。</p>

      <form method="POST">
        <label for="prompt">关键词 / 起始句</label>
        <input id="prompt" name="prompt" type="text" placeholder="例如：春江花月夜" value="{{ prompt }}" />
        <button type="submit" {% if not model_ready %}disabled{% endif %}>生成诗句</button>
      </form>

      {% if not model_ready %}
      <div class="warn">
模型未加载成功。
期望模型目录：{{ model_dir }}
错误信息：{{ model_error }}
      </div>
      {% endif %}

      {% if generated %}
      <div class="output">{{ generated }}</div>
      {% endif %}

      <div class="foot">模型：fine-tuned GPT-2（Transformers）</div>
    </div>
  </div>
</body>
</html>
